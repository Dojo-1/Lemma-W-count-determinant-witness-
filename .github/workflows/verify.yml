name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Theorem, exact, all words n <= 7
        run: python src/verify_theorem.py 7
      - name: G3 (Moufang crossing) for 3-letter words n <= 8
        run: python src/g3_check.py 8
      - name: G3-R rigid-separator certificates n <= 8
        run: python src/rigid_separators.py 8
      - name: Lemma M / Proposition S (three-block separation) n <= 7, formula a+b+c <= 10
        run: python src/lemma_m.py 7 10
      - name: Proposition C (D_N-components of interval words) n <= 8
        run: python src/sigma_complete.py 8
      - name: Lemma R' stable-node separators n <= 8 and the G3-R counterexamples
        run: |
          python src/stable_separators.py 8
          python src/stable_separators.py words xyxyzzyxyx xyyxzzxyyx xyxyzyyzyxyx xyxyzzyyzxzx xyxyzzzzyxyx xyyxzzzzxyyx
      - name: Proposition Q' run-comb certificates (cross-checked) n <= 8
        run: python src/run_comb.py 8
      - name: Caterpillar certificates - Proposition E base cases (R<=5), sanity R<=10, word validation n<=8
        run: python src/caterpillar.py 10 8
      - name: Interval rank lemma, brute force n <= 10
        run: python src/lemmaI_check.py 10
      - name: Exact class certification (full polarization) n <= 5
        run: python src/certify_exact.py 5
      - name: Certificate replay with Dojo-1/ZFC-A- certcheck (skipped if not accessible)
        run: |
          if git clone --depth 1 https://github.com/Dojo-1/ZFC-A- ZFC-A- 2>/dev/null; then
            python src/certs.py 5
          else
            echo "ZFC-A- not accessible from CI; skipping certificate replay"
          fi
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean formalization (Proposition E, finite base, Lemma Cat determinants)
        working-directory: lean
        run: |
          lake build
          grep -rn "sorry\|admit\|native_decide" Caterpillar/ && exit 1 || true
          printf 'import Caterpillar\n#print axioms Caterpillar.cat_of_word\n#print axioms Caterpillar.rank3\n#print axioms Caterpillar.caterpillar_separates\n#print axioms Caterpillar.g3_trees\n#print axioms Octonion.moufang_middle\n#print axioms Octonion.lemmaW_span\n#print axioms Octonion.lemmaW_expansion\n#print axioms Octonion.context_cancel\n#print axioms Octonion.artin\n#print axioms Octonion.kill_DN\n#print axioms Octonion.propT_count\n#print axioms Octonion.propC_forward\n#print axioms PropS.propS_interior\n#print axioms Octonion.lift_separates\n#print axioms Octonion.propC_iff\n#print axioms PropT.propT\n#print axioms LemmaM.lemmaM\n' > Axioms.lean
          lake env lean Axioms.lean
  prolog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog-core
      - name: Prolog formalization (base, constructive induction re-checked, words)
        working-directory: prolog
        run: |
          swipl -q -g main -t halt caterpillar.pl
          swipl -q -g main -t halt octonion.pl
          swipl -q -g main -t halt trees.pl
          swipl -q -g main -t halt algebra.pl
          swipl -q -g main -t halt g2.pl
          swipl -q -g run -t halt proofs.pl
