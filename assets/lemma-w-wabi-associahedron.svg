<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">Lemma W — a count determinant witnesses nonlocality</title>
<desc id="desc">Original Wabi-Futurist mathematical artwork. On an obsidian background, five binary bracketings of the distinct-letter word xyzw form the correct five-edge associahedron K4 pentagon. A vermilion edge marks an example of a rank-three reassociation that cannot be an identity edge. The separate identity matrix depicts the rank-three count minor for singleton segments x, y, z. It is a mathematical illustration, not a complete computational certificate.</desc>
